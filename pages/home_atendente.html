<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safe Atendimento - Home Atendente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              secondary: { 500: '#EC297B' }
            }
          }
        }
      }
    </script>
  </head>
  <body class="font-['Inter',sans-serif] bg-gradient-to-br from-blue-500 to-blue-700 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-10 shadow-2xl w-full max-w-[900px] border border-white/20">
      <div class="flex items-center justify-between gap-4 mb-8">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
            <i class="fas fa-user-nurse text-xl"></i>
          </div>
          <div>
            <div class="text-2xl font-extrabold text-gray-800">Home do Atendente</div>
            <div class="text-sm text-gray-500">Acesso exclusivo</div>
          </div>
        </div>
        <button class="bg-transparent text-blue-600 border-2 border-blue-600 rounded-xl py-2 px-4 font-semibold hover:bg-blue-50" onclick="logout()">
          <i class="fas fa-sign-out-alt mr-2"></i>Sair
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <a href="atendente.html" class="block bg-white rounded-2xl p-6 border border-gray-200 shadow-md hover:shadow-lg transition-all">
          <div class="text-blue-600 text-2xl mb-2"><i class="fas fa-clipboard-list"></i></div>
          <div class="text-lg font-bold text-gray-800">Cadastros & Fila</div>
          <div class="text-sm text-gray-500 mt-1">Cadastrar nome, ver pendentes</div>
        </a>

        <a href="painel.html" class="block bg-white rounded-2xl p-6 border border-gray-200 shadow-md hover:shadow-lg transition-all">
          <div class="text-blue-600 text-2xl mb-2"><i class="fas fa-tv"></i></div>
          <div class="text-lg font-bold text-gray-800">Painel Público (TV)</div>
          <div class="text-sm text-gray-500 mt-1">Fila geral (sem encaminhados)</div>
        </a>

        <a href="historico.html" class="block bg-white rounded-2xl p-6 border border-gray-200 shadow-md hover:shadow-lg transition-all">
          <div class="text-blue-600 text-2xl mb-2"><i class="fas fa-clock-rotate-left"></i></div>
          <div class="text-lg font-bold text-gray-800">Histórico</div>
          <div class="text-sm text-gray-500 mt-1">Atendimentos e registros</div>
        </a>
      </div>
    </div>

    <script>
      (function enforceAtendente() {
        try {
          const logged = JSON.parse(localStorage.getItem('loggedUser') || '{}');
          const role = String(logged?.role || '').trim().toLowerCase();
          const allowed = new Set(['atendente', 'enfermagem']);
          if (!role || !allowed.has(role)) {
            window.location.href = 'login.html';
          }
        } catch {
          window.location.href = 'login.html';
        }
      })();
      function logout() {
        localStorage.removeItem('loggedUser');
        window.location.href = 'login.html';
      }
      window.logout = logout;
    </script>
  </body>
</html>
